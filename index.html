<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive 3D journey through every layer of planet Earth — from the exosphere to the inner core." />
    <title>Strata — Earth, Layer by Layer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23c9b08a'/><circle cx='16' cy='16' r='11' fill='%23c2412d'/><circle cx='16' cy='16' r='7' fill='%23ff9a2e'/><circle cx='16' cy='16' r='3' fill='%23fff2c4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D cutaway of planet Earth"></canvas>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="callouts"></div>

    <header class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div>
        <h1>Strata</h1>
        <p>Earth, layer by layer</p>
      </div>
    </header>

    <aside id="layers-panel" class="panel" aria-label="Layers"></aside>
    <aside id="info-panel" class="panel" aria-label="Layer details"></aside>

    <div id="tooltip" role="status"></div>
    <div id="legend" class="panel"></div>
    <div id="seismic-hud" class="panel"></div>
    <div id="tour-card" class="panel"></div>
    <div id="help" class="panel" hidden></div>

    <nav id="dock" class="panel" aria-label="Controls"></nav>

    <div id="loader">
      <div class="loader-rings"><span></span><span></span><span></span><span></span></div>
      <p>Assembling the planet…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
